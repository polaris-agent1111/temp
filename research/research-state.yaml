project:
  title: "iDSN Q1 pacing: how far can offline evaluation be trusted, and where to spend official shots"
  question: >
    Can an offline simulator rank pacer configs like the official evaluator, and how large must an
    official score difference be to reflect a transferable (new-seed) effect?
  status: active
  started: "2026-11-09"
  domain: "network transport / QUIC pacing / simulation calibration"

literature:
  facts:
    - "lsquic master: LSQUIC_DF_CC_ALGO = BBRv1 (include/lsquic.h); a 2020 issue says the default was Cubic then. Competition stack version unknown."
    - "TrafficGenerator client: Poisson requests at -b Mbps, persistent TCP connections plus new ones when none idle; -s seed defaults to system time."
  open_problems:
    - "Download CC, bottleneck queue size, leak 'reject' semantics, timer semantics: not identifiable from 10 official totals"

hypotheses:
  - {id: H0, status: supported, statement: "sim v1 has no skill (LOO 22.7 s vs constant 9.04 s)"}
  - {id: H1, status: refuted, statement: "per-flow TCP background sim_v2 beats constant (best 9.8 s over 24 variants)"}
  - {id: H2, status: supported, statement: "official repeat sd 0.47 s; U-fit residual 1.48 s"}
  - {id: H3, status: refuted, statement: "system chaotic under fixed seed -> refuted; CRN cuts variance 20x; +-1-pkt effects seed-specific sd 2.0 s (exploratory)"}
  - id: H4
    status: pending
    priority: high
    statement: "Design remaining official shots as structural contrasts with expected |effect| >= 5 s (bypass modules on 4 ms timer; cap vs rate decomposition of staircase gain)"

experiments:
  proxy_metric: "LOO-RMSE (s) of offset-corrected sim predictions vs 10 official points; constant model = 9.04"
  baseline_value: 22.69
  best_value: 9.82
  total_runs: 4
  trajectory:
    - {run_id: H0, metric_value: 22.69, change_summary: "existing sim v1"}
    - {run_id: H1-grid1-best, metric_value: 9.82, change_summary: "sim_v2 q400 bbr rto0.5 warmup5 lat0"}

outer_loop:
  cycle: 1
  last_direction: pivot
  last_reflection: "Stop chasing absolute sim fidelity; treat official as fixed-seed benchmark; spend shots on >=5 s structural contrasts; paired-seed local A/B."

workspace:
  findings: "research/findings.md"
  log: "research/research-log.md"
  experiments_dir: "research/experiments/"
  to_human_dir: "research/to_human/"
